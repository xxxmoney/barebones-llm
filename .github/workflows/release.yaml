
name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
      contents: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Build App
        working-directory: ./backend
        run: |
          pip install poetry
          poetry install
          poetry run poe build

      - name: Get Version
        id: version
        working-directory: ./backend
        run: |
          $APP_VERSION = poetry version --short
          echo "APP_VERSION=$APP_VERSION" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.APP_VERSION }}"
          name: "v${{ steps.version.outputs.APP_VERSION }}"
          files: backend/dist/*.exe
          generate_release_notes: true


