
name: Build and Release

on:
  push:
    branches:
      - feature-docker-ci-cd # TODO: change later to master
  workflow_dispatch:

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'


      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Build App
        working-directory: ./backend
        run: |
          pip install poetry
          poetry install
          poetry run poe build

      - name: Upload Exe
        uses: actions/upload-artifact@v4
        with:
          name: BarebonesLLM-Windows
          path: ./backend/dist/*.exe

